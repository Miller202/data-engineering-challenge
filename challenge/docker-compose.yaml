# Ambiente local do challenge: Apache Airflow (LocalExecutor) + PostgreSQL.
#
# - postgres-airflow: banco de metadados do Airflow.
# - postgres-dw: banco de dados do desafio (camadas raw, trusted e refined).
# - airflow-init: migra o banco do Airflow e cria o user admin.
# - airflow-webserver / airflow-scheduler: services do Airflow.
#
# Uso: docker compose up -d  ->  http://localhost:8080 (admin / admin)

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5-python3.11}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_NYC_TAXI_DW: postgresql://${DW_USER:-nyc}:${DW_PASSWORD:-nyc}@postgres-dw:5432/${DW_DB:-nyc_taxi} # conexao
    NYC_TLC_DATA_DIR: /opt/airflow/data # diretorio com os arquivos parquet
  volumes:
    - ./dags:/opt/airflow/dags
    - ./queries:/opt/airflow/queries
    - ./logs:/opt/airflow/logs
    - ../nyc-tlc-data:/opt/airflow/data:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER:-nyc}
      POSTGRES_PASSWORD: ${DW_PASSWORD:-nyc}
      POSTGRES_DB: ${DW_DB:-nyc_taxi}
    # Ajustes para cargas grandes (~40 Mi de linhas). Com wal_level=minimal.
    command:
      - postgres
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=256MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=1GB
    shm_size: 1gb
    ports:
      - "${DW_PORT:-5433}:5432"
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DW_USER:-nyc}", "-d", "${DW_DB:-nyc_taxi}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
  postgres-dw-data:
